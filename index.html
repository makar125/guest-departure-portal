<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Prevents tap misalignments and unwanted zooming -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f6fa">
  <title>Guest Departure Information</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* 1. We MUST allow vertical scrolling for native pull-to-refresh to work */
    html {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overscroll-behavior-y: auto; /* Enables native drag-to-reload on Android/iOS */
    }

    body {
      width: 100%;
      min-height: 100.1%; /* Subtle extra height to let the browser trigger overscroll */
      margin: 0;
      padding: 0;
      background: #f3f6fa;
      display: flex;
      flex-direction: column;
    }

    /* 2. The Pull Bar: This catches your finger swipe at the top of the screen */
    .pull-sensor {
      width: 100%;
      height: 28px;
      padding-top: env(safe-area-inset-top, 0px);
      background: #f3f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
      touch-action: pan-down; /* Encourages downward pull */
    }

    /* Subtle indicator pill so the user intuitively knows to drag here */
    .pull-pill {
      width: 36px;
      height: 4px;
      background-color: #cbd5e1;
      border-radius: 999px;
    }

    /* 3. The iFrame takes the remaining height of the screen */
    #portal-frame {
      display: block;
      width: 100%;
      flex-grow: 1;
      height: calc(100vh - 28px);
      height: calc(100dvh - 28px);
      border: 0;
      margin: 0;
      padding: 0;
      background: #f3f6fa;
    }
  </style>
</head>
<body>

  <!-- Touch starts here: Triggers native Android/iOS pull-to-refresh -->
  <div class="pull-sensor">
    <div class="pull-pill"></div>
  </div>

  <iframe
    id="portal-frame"
    src="PASTE_YOUR_PUBLIC_APPS_SCRIPT_EXEC_URL_HERE"
    title="Guest Departure Information"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

</body>
</html>
